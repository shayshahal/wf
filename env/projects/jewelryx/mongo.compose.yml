# env/projects/jewelryx/mongo.compose.yml: the dev stack's mongo (mongo.ts mongoUp, slug dev), which
# holds every round's database too. Until 2026-10-04 each worktree had one of its own.
#
# Everything unique (container, port, volume, project) comes from
# WT_SLUG / WT_MONGO_PORT in the environment. Same image as the base
# compose (mongo:7).

services:
  mongo:
    image: mongo:7
    container_name: jewelryx-mongo-${WT_SLUG}
    restart: unless-stopped
    ports:
      - "${WT_MONGO_PORT}:27017"
    volumes:
      - worktree-mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 5s
      timeout: 3s
      retries: 12

volumes:
  worktree-mongo-data:
    name: jewelryx-wt-mongo-${WT_SLUG}
